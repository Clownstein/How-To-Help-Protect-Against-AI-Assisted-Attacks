# AI inference egress policy for Squid in transparent (intercept) mode.
#
# Use this file only when Squid already receives redirected TLS traffic on an https_port
# configured with "intercept ssl-bump" and a signing certificate. It peeks at the TLS
# ClientHello and terminates connections whose SNI matches the AI inference lists; all other
# traffic is spliced without decryption. Include it before any existing ssl_bump lines:
#
#   include /etc/squid/ai-inference/squid-intercept.conf
#
# Squid evaluates ssl::server_name with dstdomain semantics, so the same list files apply.

acl ai_inference_step1 at_step SslBump1
acl ai_inference_sni ssl::server_name "/etc/squid/ai-inference/ai-inference-domains.txt"
acl ai_inference_sni_regex ssl::server_name_regex -i "/etc/squid/ai-inference/ai-inference-domain-regex.txt"

ssl_bump peek ai_inference_step1
ssl_bump terminate ai_inference_sni
ssl_bump terminate ai_inference_sni_regex
ssl_bump splice all
