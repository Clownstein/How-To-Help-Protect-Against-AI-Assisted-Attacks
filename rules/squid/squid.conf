# AI inference egress policy for Squid (explicit forward proxy).
#
# Copy the list files from this directory to /etc/squid/ai-inference/ and include this file
# from squid.conf before the first "http_access allow" line, for example:
#
#   include /etc/squid/ai-inference/squid.conf
#
# To enforce the full profile, point ai_inference_domains at ai-inference-domains-full.txt.
# Validate with "squid -k parse" and apply with "squid -k reconfigure".

acl ai_inference_domains dstdomain "/etc/squid/ai-inference/ai-inference-domains.txt"
acl ai_inference_domain_regex dstdom_regex -i "/etc/squid/ai-inference/ai-inference-domain-regex.txt"
acl ai_inference_url_regex url_regex -i "/etc/squid/ai-inference/ai-inference-url-regex.txt"

# CONNECT tunnels and plain HTTP requests are matched on the destination host.
http_access deny ai_inference_domains
http_access deny ai_inference_domain_regex

# URL paths are visible only for plain HTTP and for HTTPS that Squid decrypts with ssl_bump.
# This entry blocks the Cloudflare Workers AI path without blocking the rest of api.cloudflare.com.
http_access deny ai_inference_url_regex
