name: Package plugins

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins/**
      - tools/package_plugins.py
      - .github/workflows/package-plugins.yml

permissions:
  contents: write

concurrency:
  group: plugin-packages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build plugin archives
        run: python tools/package_plugins.py --dist dist --version "$GITHUB_SHA"

      - name: Publish the plugins release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete plugins --yes --cleanup-tag || true
          gh release create plugins \
            --target "$GITHUB_SHA" \
            --title "Plugin packages" \
            --notes "Installable WordPress, DirectAdmin, and WHM archives built from this commit." \
            dist/protect-from-ai-wordpress.zip \
            dist/protect_from_ai.tar.gz \
            dist/protect-from-ai-cpanel.tar.gz \
            dist/release.json
